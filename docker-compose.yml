version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yap_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yap_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-youtube_analytics}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yap_user} -d ${POSTGRES_DB:-youtube_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - yap_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yap_backend
    restart: always
    environment:
      PORT: 8080
      PYTHONPATH: /app
      DATABASE_URL: postgresql://${POSTGRES_USER:-yap_user}:${POSTGRES_PASSWORD:-yap_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-youtube_analytics}
      JWT_SECRET: ${JWT_SECRET:-${SECRET_KEY:-change-in-production-jwt-secret-key-32chars-min}}
      SECRET_KEY: ${SECRET_KEY:-${JWT_SECRET:-change-in-production-jwt-secret-key-32chars-min}}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-${ENCRYPTION_KEY:-8vX_8uM_6eN_4rT_2wQ_0zY_9xW_7vU_5sR_3qP_1oN=}}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-${ENCRYPTION_SECRET:-8vX_8uM_6eN_4rT_2wQ_0zY_9xW_7vU_5sR_3qP_1oN=}}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-${TELEGRAM_WEBHOOK_SECRET:-}}
      DOKPLOY_WEB_DOMAIN: ${DOKPLOY_WEB_DOMAIN:-yap.oxyjet.win}
      DOKPLOY_API_DOMAIN: ${DOKPLOY_API_DOMAIN:-api.yap.oxyjet.win}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yap_network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.yap-backend.rule=Host(`api.yap.oxyjet.win`)"
      - "traefik.http.routers.yap-backend.entrypoints=websecure"
      - "traefik.http.routers.yap-backend.tls=true"
      - "traefik.http.routers.yap-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.yap-backend.loadbalancer.server.port=8080"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: yap_dashboard
    restart: always
    environment:
      PORT: 8080
      PYTHONPATH: /app
      BACKEND_API_URL: http://backend:8080/api/v1
      DOKPLOY_WEB_DOMAIN: ${DOKPLOY_WEB_DOMAIN:-yap.oxyjet.win}
      DOKPLOY_API_DOMAIN: ${DOKPLOY_API_DOMAIN:-api.yap.oxyjet.win}
    depends_on:
      - backend
    networks:
      - yap_network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.yap-dashboard.rule=Host(`yap.oxyjet.win`)"
      - "traefik.http.routers.yap-dashboard.entrypoints=websecure"
      - "traefik.http.routers.yap-dashboard.tls=true"
      - "traefik.http.routers.yap-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.yap-dashboard.loadbalancer.server.port=8080"

volumes:
  postgres_data:
    driver: local

networks:
  yap_network:
    driver: bridge
  dokploy-network:
    external: true

